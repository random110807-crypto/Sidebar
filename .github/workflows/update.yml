name: Update NKT sidebar data

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nkt-sidebar-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Fetch Chess.com public data
        run: python scripts/update_data.py
        env:
          CHESSCOM_USER_AGENT: "NKT-Community-Sidebar/1.0 (GitHub Actions)"

      - name: Commit updated data
        run: |
          if git diff --quiet -- data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update NKT sidebar data"
          git push
